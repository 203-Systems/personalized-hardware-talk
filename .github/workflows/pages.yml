name: Deploy presentation to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate slide packages
        run: |
          python3 scripts/validate.py
          python3 scripts/validate_versions.py
          node --check app.js
          node --check collaboration.js
          node --check agent.js
          node --check agent-service/server.mjs
          node --check progress.js
          python3 -m py_compile scripts/build_site.py scripts/verify_deploy.py
          node scripts/test_progress.mjs
      - uses: actions/configure-pages@v5
      - name: Collect public website
        run: python3 scripts/build_site.py .build/site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .build/site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
